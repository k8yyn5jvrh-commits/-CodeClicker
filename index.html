<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1f" />
  <title>Code Clicker</title>
  <style>
:root{--bg:#080b14;--card:#111827;--card2:#0e1527;--line:#263146;--text:#f5f7ff;--muted:#92a0b8;--accent:#66f7c8;--accent2:#7c8cff;--danger:#ff6d8d;--shadow:0 18px 50px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17203c 0,#090d18 42%,#05070d 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app-shell{width:min(1180px,100%);margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:800}.topbar h1{margin:4px 0 0;font-size:clamp(28px,5vw,44px)}.level-chip{border:1px solid #314060;background:#151d32;padding:10px 14px;border-radius:14px;font-weight:800}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:linear-gradient(180deg,rgba(18,27,48,.96),rgba(11,17,31,.96));border:1px solid rgba(91,113,156,.25);border-radius:22px;box-shadow:var(--shadow);padding:20px}.editor-card{grid-column:1/-1}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats-row>div{padding:14px;background:#0a1020;border:1px solid #202a40;border-radius:14px}.label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.stats-row strong{font-size:20px}.energy-wrap{margin-top:16px}.energy-head{display:flex;justify-content:space-between;margin-bottom:8px}.bar{height:12px;background:#080d18;border-radius:999px;overflow:hidden;border:1px solid #242f47}.bar-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .2s}.controls-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.controls-row label{font-size:12px;color:var(--muted)}select,.project-title{width:100%;margin-top:6px;background:#0a1020;color:var(--text);border:1px solid #28334a;border-radius:12px;padding:11px}.code-button{width:100%;min-height:126px;border:0;border-radius:20px;background:linear-gradient(135deg,#5b66ff,#38d6a3);color:#071019;font-weight:1000;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 15px 45px rgba(82,110,255,.35);cursor:pointer;transition:.12s transform,.12s filter}.code-button:active{transform:scale(.985)}.code-button:disabled{filter:grayscale(.9);opacity:.55}.code-icon{font-size:30px}.code-button small{font-size:11px;margin-top:5px}.code-stream{height:178px;overflow:auto;background:#050914;border:1px solid #1f2a40;border-radius:14px;padding:14px;color:#82ffbd;white-space:pre-wrap}.section-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.section-head h2{margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.server-list{display:grid;gap:10px;margin-top:14px}.server{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:13px;border:1px solid #25324a;background:#0a1020;border-radius:14px}.server h3{font-size:15px;margin:0}.server p{font-size:12px;color:var(--muted);margin:4px 0 0}.server button,.btn{border:1px solid #34425e;background:#17213a;color:white;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:700}.server button:disabled{opacity:.45}.btn.primary{background:linear-gradient(135deg,#6471ff,#4bd7b1);color:#071019;border:0}.editor-head{align-items:flex-end}.actions{display:flex;gap:8px;flex-wrap:wrap}.project-title{font-size:16px;font-weight:800;margin:16px 0 10px}.tabs{display:flex;gap:6px}.tab{border:1px solid #2a3650;background:#0a1020;color:#a9b4c7;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer}.tab.active{color:white;background:#18233d;border-bottom-color:#18233d}textarea{width:100%;height:290px;resize:vertical;border:1px solid #2a3650;background:#070b14;color:#dce7ff;padding:16px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border-radius:0 14px 14px 14px;outline:none}.preview-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.bot-state{font-size:12px;color:var(--muted)}iframe{width:100%;height:320px;border:1px solid #2a3650;border-radius:14px;background:white}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#10192c;color:white;border:1px solid #34415a;border-radius:14px;padding:12px 16px;transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
body[data-theme="matrix"]{--accent:#55ff88;--accent2:#1fcf63}body[data-theme="retro"]{--accent:#ffd166;--accent2:#ff5f94}body[data-theme="minimal"]{--accent:#dfe7ff;--accent2:#9fb0cb}
@media(max-width:800px){.app-shell{padding:14px}.grid{grid-template-columns:1fr}.editor-card{grid-column:auto}.stats-row{grid-template-columns:1fr 1fr}.stats-row>div:last-child{grid-column:1/-1}.editor-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.controls-row{grid-template-columns:1fr}.card{padding:15px;border-radius:18px}textarea{height:250px}iframe{height:280px}}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">DEV TYCOON</div>
        <h1>Code Clicker</h1>
      </div>
      <div class="level-chip">LVL <span id="level">1</span></div>
    </header>

    <main class="grid">
      <section class="card clicker-card">
        <div class="stats-row">
          <div><span class="label">Кредиты</span><strong id="credits">0</strong></div>
          <div><span class="label">Строк кода</span><strong id="lines">0</strong></div>
          <div><span class="label">XP</span><strong><span id="xp">0</span>/<span id="xpNeed">100</span></strong></div>
        </div>

        <div class="energy-wrap">
          <div class="energy-head"><span>⚡ Энергия</span><b><span id="energy">100</span>/<span id="maxEnergy">100</span></b></div>
          <div class="bar"><div id="energyBar" class="bar-fill"></div></div>
        </div>

        <div class="controls-row">
          <label>
            Язык
            <select id="language">
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="js">JavaScript</option>
            </select>
          </label>
          <label>
            Тема
            <select id="theme">
              <option value="neon">Neon</option>
              <option value="matrix">Matrix</option>
              <option value="retro">Retro</option>
              <option value="minimal">Minimal</option>
            </select>
          </label>
        </div>

        <button id="codeButton" class="code-button" type="button">
          <span class="code-icon">&lt;/&gt;</span>
          <span>ПИСАТЬ КОД</span>
          <small>-1 энергия</small>
        </button>

        <pre id="stream" class="code-stream"><code>// Нажми «ПИСАТЬ КОД»</code></pre>
      </section>

      <section class="card upgrades-card">
        <div class="section-head"><h2>🖥 Серверная</h2><span id="income">+1 кредит/клик</span></div>
        <div id="servers" class="server-list"></div>
      </section>

      <section class="card editor-card">
        <div class="section-head editor-head">
          <div>
            <h2>⌨️ Реальный код</h2>
            <p>HTML + CSS + JavaScript запускаются прямо здесь.</p>
          </div>
          <div class="actions">
            <button id="runBtn" class="btn primary">▶ Запустить</button>
            <button id="copyBtn" class="btn">Копировать</button>
            <button id="publishBtn" class="btn">📤 Поделиться</button>
          </div>
        </div>

        <input id="projectTitle" class="project-title" value="Мой первый проект" maxlength="80" />

        <div class="tabs">
          <button class="tab active" data-tab="html">HTML</button>
          <button class="tab" data-tab="css">CSS</button>
          <button class="tab" data-tab="js">JS</button>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>

        <div class="preview-head"><span>Результат</span><span id="botState" class="bot-state">Telegram: проверка…</span></div>
        <iframe id="preview" sandbox="allow-scripts"></iframe>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
const $ = (s) => document.querySelector(s);

const defaultFiles = {
  html: `<main class="hero">\n  <h1>Привет, программист 👋</h1>\n  <p>Этот код реально работает.</p>\n  <button id="demoBtn">Нажми меня</button>\n</main>`,
  css: `body {\n  font-family: system-ui, sans-serif;\n  margin: 0;\n  min-height: 100vh;\n  display: grid;\n  place-items: center;\n  background: #0b1020;\n  color: white;\n}\n.hero { text-align: center; }\nbutton { padding: 12px 18px; border: 0; border-radius: 12px; cursor: pointer; }`,
  js: `document.querySelector('#demoBtn')?.addEventListener('click', () => {\n  document.querySelector('h1').textContent = 'Код работает! 🚀';\n});`
};

const snippets = {
  html: ['<section class="card">', '<h2>Новый компонент</h2>', '<button>Запустить</button>', '<input placeholder="Введите текст">', '<div class="app">Hello world</div>', '<nav><a href="#">Главная</a></nav>', '<canvas id="game"></canvas>'],
  css: ['display: grid;', 'gap: 16px;', 'border-radius: 16px;', 'background: linear-gradient(135deg,#111827,#1f2937);', 'transition: .2s ease;', 'box-shadow: 0 12px 40px rgba(0,0,0,.3);', 'font-weight: 800;'],
  js: ['const score = 0;', 'button.addEventListener("click", play);', 'localStorage.setItem("progress", JSON.stringify(data));', 'requestAnimationFrame(update);', 'const random = Math.floor(Math.random() * 100);', 'document.body.classList.toggle("active");', 'async function loadData() { return await fetch("/api/data"); }']
};

const serverDefs = [
  { id: 'laptop', name: 'Старый ноутбук', desc: '+1 к кредитам за клик', base: 25, income: 1, regen: 0 },
  { id: 'vps', name: 'VPS', desc: '+3 к кредитам, +0.4 энергии/с', base: 120, income: 3, regen: .4 },
  { id: 'rack', name: 'Серверная стойка', desc: '+9 к кредитам, +1 энергии/с', base: 550, income: 9, regen: 1 },
  { id: 'cluster', name: 'GPU-кластер', desc: '+25 к кредитам, +2.5 энергии/с', base: 2400, income: 25, regen: 2.5 }
];

const saved = JSON.parse(localStorage.getItem('codeClickerState') || 'null');
const state = Object.assign({ credits: 0, lines: 0, xp: 0, level: 1, energy: 100, maxEnergy: 100, language: 'html', theme: 'neon', servers: {}, files: structuredClone(defaultFiles), activeTab: 'html', projectTitle: 'Мой первый проект' }, saved || {});
for (const s of serverDefs) state.servers[s.id] ??= 0;
for (const k of Object.keys(defaultFiles)) state.files[k] ??= defaultFiles[k];

function xpNeed(){ return 100 + (state.level - 1) * 70; }
function clickIncome(){ return 1 + serverDefs.reduce((n, s) => n + state.servers[s.id] * s.income, 0); }
function regenRate(){ return .7 + serverDefs.reduce((n, s) => n + state.servers[s.id] * s.regen, 0); }
function serverCost(s){ return Math.floor(s.base * Math.pow(1.72, state.servers[s.id])); }

function save(){
  localStorage.setItem('codeClickerState', JSON.stringify(state));
}

function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

function levelUp(){
  while (state.xp >= xpNeed()) {
    state.xp -= xpNeed(); state.level++; state.maxEnergy += 10; state.energy = state.maxEnergy;
    toast(`Новый уровень: ${state.level}! ⚡`);
  }
}

function renderServers(){
  $('#servers').innerHTML = '';
  serverDefs.forEach(s => {
    const cost = serverCost(s); const lvl = state.servers[s.id];
    const row = document.createElement('div'); row.className = 'server';
    row.innerHTML = `<div><h3>${s.name} · ур. ${lvl}</h3><p>${s.desc}</p></div><button ${state.credits < cost ? 'disabled' : ''}>${cost} 💳</button>`;
    row.querySelector('button').onclick = () => {
      if (state.credits < cost) return;
      state.credits -= cost; state.servers[s.id]++; state.xp += 12; levelUp(); save(); render();
    };
    $('#servers').appendChild(row);
  });
}

function render(){
  $('#credits').textContent = Math.floor(state.credits);
  $('#lines').textContent = state.lines;
  $('#xp').textContent = Math.floor(state.xp);
  $('#xpNeed').textContent = xpNeed();
  $('#level').textContent = state.level;
  $('#energy').textContent = Math.floor(state.energy);
  $('#maxEnergy').textContent = state.maxEnergy;
  $('#energyBar').style.width = `${Math.max(0, Math.min(100, state.energy / state.maxEnergy * 100))}%`;
  $('#codeButton').disabled = state.energy < 1;
  $('#language').value = state.language;
  $('#theme').value = state.theme;
  document.body.dataset.theme = state.theme;
  $('#income').textContent = `+${clickIncome()} кредитов/клик · +${regenRate().toFixed(1)} ⚡/с`;
  renderServers();
}

function addCodeLine(){
  if (state.energy < 1) return toast('Энергия закончилась');
  const arr = snippets[state.language]; const line = arr[Math.floor(Math.random() * arr.length)];
  state.energy -= 1; state.lines += 1; state.credits += clickIncome(); state.xp += 2;
  levelUp();
  const stream = $('#stream');
  const existing = stream.textContent === '// Нажми «ПИСАТЬ КОД»' ? '' : stream.textContent + '\n';
  stream.textContent = (existing + line).split('\n').slice(-18).join('\n');
  stream.scrollTop = stream.scrollHeight;
  save(); render();
}

function syncEditor(){
  state.files[state.activeTab] = $('#editor').value;
  state.projectTitle = $('#projectTitle').value;
  save();
}

function selectTab(tab){
  syncEditor(); state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('#editor').value = state.files[tab]; save();
}

function runProject(){
  syncEditor();
  const src = `<!doctype html><html><head><meta charset="utf-8"><style>${state.files.css}</style></head><body>${state.files.html}<script>${state.files.js.replace(/<\/script/gi, '<\\/script')}<\\/script></body></html>`;
  $('#preview').srcdoc = src;
  state.xp += 5; levelUp(); save(); render();
}

async function copyProject(){
  syncEditor();
  const text = `HTML\n${state.files.html}\n\nCSS\n${state.files.css}\n\nJS\n${state.files.js}`;
  await navigator.clipboard.writeText(text); toast('Код скопирован');
}

function initTelegram(){
  const tg = window.Telegram?.WebApp;
  if (!tg) {
    $('#botState').textContent = 'Открыто в браузере';
    return;
  }
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor?.('#0a0f1f'); tg.setBackgroundColor?.('#0a0f1f'); } catch {}
  const user = tg.initDataUnsafe?.user;
  $('#botState').textContent = user ? `Telegram: ${user.username ? '@'+user.username : user.first_name || 'подключён'} ✅` : 'Telegram Mini App ✅';
}

function publishProject(){
  syncEditor();
  const url = location.href.split('#')[0];
  const text = `Я сделал проект «${state.projectTitle}» в Code Clicker 🚀`;
  const share = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
  const tg = window.Telegram?.WebApp;
  if (tg?.openTelegramLink) tg.openTelegramLink(share);
  else window.open(share, '_blank', 'noopener,noreferrer');
  toast('Открываю отправку в Telegram');
}


$('#codeButton').onclick = addCodeLine;
$('#language').onchange = e => { state.language = e.target.value; save(); };
$('#theme').onchange = e => { state.theme = e.target.value; save(); render(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => selectTab(b.dataset.tab));
$('#editor').addEventListener('input', syncEditor);
$('#projectTitle').addEventListener('input', syncEditor);
$('#runBtn').onclick = runProject;
$('#copyBtn').onclick = copyProject;
$('#publishBtn').onclick = publishProject;

$('#editor').value = state.files[state.activeTab];
$('#projectTitle').value = state.projectTitle;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === state.activeTab));
setInterval(() => { if (state.energy < state.maxEnergy) { state.energy = Math.min(state.maxEnergy, state.energy + regenRate()/4); save(); render(); } }, 250);
render(); runProject(); initTelegram();

</script>
</body>
</html>
